<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">Pipeline experimental do Digit Robustness Lab</title><desc id="desc">Fluxo do MNIST até benchmark, robustez OOD e manuscritos externos.</desc><defs><linearGradient id="header" x1="0" x2="1"><stop stop-color="#0b2036"/><stop offset="1" stop-color="#286879"/></linearGradient><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#5e959f"/></marker><style>.heading{font:750 30px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.subheading{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#c7dce1}.step{font:750 18px Inter,Segoe UI,Arial,sans-serif;fill:#102a3e}.detail{font:500 13px Inter,Segoe UI,Arial,sans-serif;fill:#667085}.mono{font:650 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#21485f}.number{font:800 14px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.flow{fill:none;stroke:#5e959f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style></defs><rect width="1500" height="760" rx="24" fill="#f6f9fb"/><rect width="1500" height="96" rx="24" fill="url(#header)"/><rect y="72" width="1500" height="24" fill="url(#header)"/><text x="54" y="43" class="heading">Pipeline experimental</text><text x="54" y="70" class="subheading">aquisição redundante → benchmark supervisionado → robustez OOD → generalização manuscrita</text>
<path d="M330 205H414" class="flow"/><path d="M690 205H774" class="flow"/><path d="M1050 205H1134" class="flow"/><path d="M1272 265V348" class="flow"/><path d="M1134 418H1050" class="flow"/><path d="M774 418H690" class="flow"/><path d="M414 418H330" class="flow"/>
<g transform="translate(54 145)"><rect width="276" height="120" rx="16" fill="#fff" stroke="#c7dce1"/><circle cx="30" cy="31" r="17" fill="#21485f"/><text x="30" y="36" text-anchor="middle" class="number">1</text><text x="58" y="37" class="step">MNIST</text><text x="22" y="73" class="detail">70.000 imagens · 28×28</text><text x="22" y="97" class="detail">fonte oficial + 2 contingências</text></g>
<g transform="translate(414 145)"><rect width="276" height="120" rx="16" fill="#fff" stroke="#c7dce1"/><circle cx="30" cy="31" r="17" fill="#21485f"/><text x="30" y="36" text-anchor="middle" class="number">2</text><text x="58" y="37" class="step">EDA</text><text x="22" y="73" class="detail">formas · classes · grade 2×5</text><text x="22" y="97" class="detail">pixels uint8 e vetor de 784</text></g>
<g transform="translate(774 145)"><rect width="276" height="120" rx="16" fill="#fff" stroke="#c7dce1"/><circle cx="30" cy="31" r="17" fill="#356c7b"/><text x="30" y="36" text-anchor="middle" class="number">3</text><text x="58" y="37" class="step">Split estratificado</text><text x="22" y="73" class="detail">49k treino · 7k validação</text><text x="22" y="97" class="detail">14k teste congelado</text></g>
<g transform="translate(1134 145)"><rect width="276" height="120" rx="16" fill="#fff" stroke="#c7dce1"/><circle cx="30" cy="31" r="17" fill="#356c7b"/><text x="30" y="36" text-anchor="middle" class="number">4</text><text x="58" y="37" class="step">Seleção</text><text x="22" y="73" class="detail">LR · RF · MLP</text><text x="22" y="97" class="detail">hiperparâmetros só na validação</text></g>
<g transform="translate(1134 358)"><rect width="276" height="120" rx="16" fill="#0f3046" stroke="#d8bd8d" stroke-width="2"/><circle cx="30" cy="31" r="17" fill="#b08d57"/><text x="30" y="36" text-anchor="middle" class="number">5</text><text x="58" y="37" class="step" style="fill:#fff">Teste independente</text><text x="22" y="73" class="detail" style="fill:#c7dce1">Accuracy · Precision · Recall</text><text x="22" y="97" class="detail" style="fill:#c7dce1">F1 · confusão · custo</text></g>
<g transform="translate(774 358)"><rect width="276" height="120" rx="16" fill="#fff" stroke="#d8bd8d" stroke-width="2"/><circle cx="30" cy="31" r="17" fill="#b08d57"/><text x="30" y="36" text-anchor="middle" class="number">A</text><text x="58" y="37" class="step">Class Masking</text><text x="22" y="73" class="detail">classes 4 e 7 removidas</text><text x="22" y="97" class="detail">MLP com 8 saídas conhecidas</text></g>
<g transform="translate(414 358)"><rect width="276" height="120" rx="16" fill="#fff" stroke="#d8bd8d" stroke-width="2"/><circle cx="30" cy="31" r="17" fill="#b08d57"/><text x="30" y="36" text-anchor="middle" class="number">B</text><text x="58" y="37" class="step">OOD semântico</text><text x="22" y="73" class="detail">MSP · entropia · overconfidence</text><text x="22" y="97" class="detail">4/7 → classes conhecidas</text></g>
<g transform="translate(54 358)"><rect width="276" height="120" rx="16" fill="#fff" stroke="#d8bd8d" stroke-width="2"/><circle cx="30" cy="31" r="17" fill="#b08d57"/><text x="30" y="36" text-anchor="middle" class="number">C</text><text x="58" y="37" class="step">Manuscritos reais</text><text x="22" y="73" class="detail">segmentação · centralização · 28×28</text><text x="22" y="97" class="detail">LR · RF · MLP + probabilidades</text></g>
<path d="M192 478V545" class="flow"/><g transform="translate(54 558)"><rect width="1356" height="82" rx="16" fill="#e6eef2"/><text x="28" y="32" class="step">Persistência e auditoria</text><text x="28" y="58" class="detail">modelos recarregáveis · JSON/NPZ · CSV · figuras · auditoria final PASS · portal de apresentação</text></g><text x="54" y="704" class="detail">O conjunto de teste não participa da seleção do campeão; os desafios de robustez são executados após o benchmark principal.</text></svg>